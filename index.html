    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 74px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.7rem 1rem;
    border-bottom: 2px solid var(--pine);
    background: var(--birch);
  }
  .topbar img { width: 68px; height: 68px; }
  .topbar .wordmark { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.3rem; color: var(--pine); letter-spacing: 0.01em; }
  .topbar .tagline { font-size: 0.75rem; color: var(--gold); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .subbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border-c);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--pine);
  }
  .subbar .sync { font-size: 0.7rem; color: var(--muted); font-family: 'Work Sans', sans-serif; font-weight: 500; display: flex; align-items: center; gap: 5px; }
  .sync-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  table { width: 100%; border-collapse: collapse; }
  .tbl-head th {
    background: var(--pine);
    color: var(--birch);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    padding: 8px 6px;
    text-align: center;
  }
  .tbl-head th:nth-child(2) { text-align: left; padding-left: 12px; }
  tbody tr { border-bottom: 1px solid var(--border-c); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  td { padding: 9px 6px; text-align: center; font-size: 0.85rem; vertical-align: middle; }
  td.pos { color: var(--muted); font-weight: 500; font-size: 0.78rem; width: 34px; }
  td.player { text-align: left; padding-left: 12px; font-family: 'Fraunces', serif; font-weight: 600; color: var(--pine); text-transform: uppercase; letter-spacing: 0.01em; font-size: 0.82rem; }
  td.pts { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.9rem; }
  td.pts.pos-score { color: var(--red); }
  td.pts.zero-score { color: var(--muted); }
  .hole-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem 0.4rem;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--pine);
  }
  .hole-heading .par { font-size: 0.68rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .stepper { display: inline-flex; align-items: center; gap: 5px; }
  .stepper button {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border-c);
    background: var(--birch);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .stepper button:active { background: var(--panel); }
  .stepper .val {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.92rem;
    width: 18px;
    text-align: center;
    display: inline-block;
  }
  .chip-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 1px solid var(--border-c);
    background: var(--birch);
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--border-c);
  }
  .chip-btn.on { background: var(--gold); border-color: var(--gold); color: var(--birch); }
  .section-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    padding: 1.1rem 1rem 0.3rem;
  }
  .btn-primary {
    background: var(--pine);
    color: var(--birch);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1rem;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    width: calc(100% - 2rem);
    margin: 0.7rem 1rem;
  }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost {
    background: var(--birch);
    color: var(--pine);
    border: 1px solid var(--pine);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 0.83rem;
    cursor: pointer;
    width: calc(100% - 2rem);
    margin: 0.4rem 1rem 1rem;
  }
  .empty-msg { font-size: 0.88rem; color: var(--muted); text-align: center; padding: 2rem 1rem; }
  .tiebreak-panel { margin: 0 1rem 0.6rem; border: 1px solid var(--border-c); border-radius: 8px; padding: 0.6rem 0.8rem; }
  .tiebreak-item { display: flex; align-items: center; gap: 10px; padding: 0.35rem 0; font-size: 0.85rem; }
  .champion-banner {
    background: var(--pine);
    color: var(--gold);
    border-radius: 0;
    padding: 1.1rem;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 0.4rem;
  }
  .star { color: var(--gold); font-size: 0.95rem; }
  .star.dim { color: var(--border-c); }
  .bottomnav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--birch);
    border-top: 1px solid var(--border-c);
    max-width: 640px;
    margin: 0 auto;
  }
  .navbtn {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 2px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
  }
  .navbtn .glyph { font-size: 1.05rem; line-height: 1; }
  .navbtn.active { color: var(--pine); font-weight: 600; }
  .footer-note { font-size: 0.7rem; color: var(--muted); text-align: center; padding: 1rem 1rem 0.5rem; }
  .footer-note span { text-decoration: underline; cursor: pointer; }
  .rules-block { padding: 0 1rem 0.4rem; font-size: 0.86rem; line-height: 1.55; color: var(--ink); }
  .rules-block ul { margin: 0; padding-left: 1.1rem; }
  .rules-block li { margin-bottom: 0.4rem; }
  .rules-block p { margin: 0; }
</style>
</head>

<script>
const HOLES = [1,2,3,4,5,6];
const DEFAULT_GROUPS = {
  A: ["Andrew","Jordan","Connor","Sully"],
  B: ["Danielle","Katie","Audrey"],
  C: ["Tara","James","Charlotte","Anna"],
  D: ["June","Julie","Snake"],
  E: ["John","Everly","Georgia"]
};
const STORAGE_KEY = "bucket-golf-state-v1";
const TAB_LABELS = { A: "Group A", B: "Group B", C: "Group C", D: "Group D", E: "Group E", leaderboard: "Leaderboard", final: "Final four", rules: "Rules", manage: "Manage Groups" };
const TAB_GLYPHS = { A: "&#9910;", B: "&#9910;", C: "&#9910;", D: "&#9910;", E: "&#9910;", leaderboard: "&#9873;", final: "&#127942;", rules: "&#128220;" };

function defaultState() {
  return {
    groups: JSON.parse(JSON.stringify(DEFAULT_GROUPS)),
    removedPlayers: [],
    stage1: { A: {}, B: {}, C: {}, D: {}, E: {} },
    stage2: { qualifiers: null, scores: {} }
  };
}

function normalizeState(s) {
  if (!s || typeof s !== "object") s = {};
  if (!s.groups || typeof s.groups !== "object") s.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
  ["A", "B", "C", "D", "E"].forEach(g => {
    if (!Array.isArray(s.groups[g])) s.groups[g] = [];
  });
  if (!Array.isArray(s.removedPlayers)) s.removedPlayers = [];
  if (!s.stage1 || typeof s.stage1 !== "object") s.stage1 = {};
  ["A", "B", "C", "D", "E"].forEach(g => {
    if (!s.stage1[g] || typeof s.stage1[g] !== "object") s.stage1[g] = {};
  });
  if (!s.stage2 || typeof s.stage2 !== "object") s.stage2 = { qualifiers: null, scores: {} };
  if (s.stage2.qualifiers === undefined) s.stage2.qualifiers = null;
  if (!s.stage2.scores || typeof s.stage2.scores !== "object") s.stage2.scores = {};
  return s;
}

let state = defaultState();
let activeTab = "A";
let adminMode = false;

function cellData(holeObj, name) {
  return holeObj && holeObj[name] ? holeObj[name] : { strokes: null, chipin: false };
}

function effectiveStrokes(cd) {
  if (cd.strokes == null) return null;
  return cd.strokes - (cd.chipin ? 1 : 0);
}

function totalsForGroup(names, stageObj) {
  const totals = {};
  names.forEach(nm => totals[nm] = 0);
  HOLES.forEach(h => {
    const holeObj = stageObj["hole" + h] || {};
    names.forEach(nm => {
      const cd = cellData(holeObj, nm);
      if (cd.strokes != null) totals[nm] += effectiveStrokes(cd);
    });
  });
  return totals;
}

function fmtPts(v) {
  const r = Math.round(v * 10) / 10;
  return (r % 1 === 0) ? String(r) : r.toFixed(1);
}

function rankLabels(rows) {
  const sorted = rows.slice().sort((a, b) => b.value - a.value);
  const labels = {};
  let i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j + 1 < sorted.length && sorted[j + 1].value === sorted[i].value) j++;
    const rank = i + 1;
    const tied = (j > i);
    sorted.slice(i, j + 1).forEach(r => { labels[r.key] = (tied ? "T" : "") + rank; });
    i = j + 1;
  }
  return labels;
}

const dbRef = firebase.database().ref(STORAGE_KEY);
let applyingRemote = false;

function loadState() {
  render();
  let connected = false;
  setTimeout(() => {
    if (!connected) setSyncStatus(false);
  }, 8000);
  dbRef.on("value", (snapshot) => {
    connected = true;
    const val = snapshot.val();
    if (val) {
      applyingRemote = true;
      state = normalizeState(val);
      render();
      applyingRemote = false;
    } else {
      state = defaultState();
      saveState();
      render();
    }
    setSyncStatus(true);
  }, (err) => {
    console.error("Firebase read failed:", err);
    setSyncStatus(false);
    render();
  });
}

function setSyncStatus(ok) {
  const el = document.getElementById("sync-indicator");
  if (!el) return;
  el.innerHTML = ok
    ? '<span class="sync-dot"></span>Live'
    : '<span class="sync-dot" style="background:var(--red);"></span>Offline &mdash; scores not saving';
}

let saveTimer = null;
function scheduleSave() {
  if (applyingRemote) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveState();
  }, 200);
}

function setStrokes(stageObj, name, holeNum, delta) {

  const key = "hole" + holeNum;
  if (!stageObj[key]) stageObj[key] = {};
  if (!stageObj[key][name]) stageObj[key][name] = { strokes: null, chipin: false };
  let cur = stageObj[key][name].strokes;
  let next = cur == null ? 1 : cur + delta;
  if (next < 1) next = 1;
  if (next > 6) next = 6;
  stageObj[key][name].strokes = next;
}

function toggleChip(stageObj, name, holeNum) {
  const key = "hole" + holeNum;
  if (!stageObj[key]) stageObj[key] = {};
  if (!stageObj[key][name]) stageObj[key][name] = { strokes: null, chipin: false };
  stageObj[key][name].chipin = !stageObj[key][name].chipin;
}

function clearStrokes(stageObj, name, holeNum) {
  const key = "hole" + holeNum;
  if (!stageObj[key]) stageObj[key] = {};
  stageObj[key][name] = { strokes: null, chipin: false };
}

function allTwelveTotals() {
  let all = [];
  Object.keys(state.groups).forEach(g => {
    const totals = totalsForGroup(state.groups[g], state.stage1[g]);
    state.groups[g].forEach(nm => all.push({ name: nm, group: g, total: totals[nm] }));
  });
  all.sort((a, b) => a.total - b.total);
  return all;
}

function renderLeaderboard() {
  const all = allTwelveTotals();
  const locked = !!state.stage2.qualifiers;
  const ranks = rankLabels(all.map(r => ({ key: r.name, value: -r.total })));
  let html = `<table><thead><tr class="tbl-head"><th>Pos</th><th>Player</th><th>Grp</th><th></th><th>Score</th></tr></thead><tbody>`;
  const cutoffIdx = 3;
  const cutoffVal = all.length > cutoffIdx ? all[cutoffIdx].total : 999999;
  all.forEach((row, idx) => {
    const inTop4 = idx < 4;
    html += `<tr>
      <td class="pos">${ranks[row.name]}</td>
      <td class="player">${row.name}</td>
      <td style="font-size:0.75rem; color:var(--muted);">${row.group}</td>
      <td>${inTop4 ? '<span class="star">&#9733;</span>' : '<span class="star dim">&#9733;</span>'}</td>
      <td class="pts pos-score">${fmtPts(row.total)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  if (!adminMode) {
    if (locked) {
      html += `<div class="section-label">Final four locked</div><div class="tiebreak-panel"><p style="margin:0;font-size:0.85rem;">${state.stage2.qualifiers.join(", ")}</p></div>`;
    } else {
      html += `<div class="section-label">Final four</div><div class="tiebreak-panel"><p style="margin:0;font-size:0.85rem;">Not locked yet &mdash; admin mode is needed to lock it in.</p></div>`;
    }
    document.getElementById("content").innerHTML = html;
    return;
  }

  if (!locked) {
    const tiedAtCutoff = all.filter(r => r.total === cutoffVal);
    const clearIn = all.filter(r => r.total < cutoffVal);
    const needed = 4 - clearIn.length;
    if (tiedAtCutoff.length > needed && needed > 0) {
      html += `<div class="section-label">Tie at the cutoff &mdash; pick ${needed} to advance</div><div class="tiebreak-panel" id="tiebreak-box">`;
      tiedAtCutoff.forEach(r => {
        html += `<label class="tiebreak-item"><input type="checkbox" class="tie-check" data-name="${r.name}"> ${r.name} (${fmtPts(r.total)})</label>`;
      });
      html += `</div><button class="btn-primary" id="lock-tiebreak" disabled>Lock final four</button>`;
    } else {
      html += `<button class="btn-primary" id="lock-final">Lock final four</button>`;
    }
  } else {
    html += `<div class="section-label">Final four locked</div><div class="tiebreak-panel"><p style="margin:0;font-size:0.85rem;">${state.stage2.qualifiers.join(", ")}</p></div><button class="btn-ghost" id="unlock-final">Unlock and re-pick</button>`;
  }
  document.getElementById("content").innerHTML = html;

  const lockBtn = document.getElementById("lock-final");
  if (lockBtn) lockBtn.addEventListener("click", () => {
    state.stage2.qualifiers = all.slice(0, 4).map(r => r.name);
    state.stage2.scores = {};
    scheduleSave();
    activeTab = "final";
    render();
  });

  const tieBoxes = document.querySelectorAll(".tie-check");
  const lockTieBtn = document.getElementById("lock-tiebreak");
  if (tieBoxes.length) {
    const clearIn = all.filter(r => r.total < cutoffVal).map(r => r.name);
    const needed = 4 - clearIn.length;
    tieBoxes.forEach(cb => cb.addEventListener("change", () => {
      const checked = Array.from(tieBoxes).filter(x => x.checked);
      lockTieBtn.disabled = checked.length !== needed;
    }));
    lockTieBtn.addEventListener("click", () => {
      const checked = Array.from(tieBoxes).filter(x => x.checked).map(x => x.dataset.name);
      state.stage2.qualifiers = clearIn.concat(checked);
      state.stage2.scores = {};
      scheduleSave();
      activeTab = "final";
      render();
    });
  }

  const unlockBtn = document.getElementById("unlock-final");
  if (unlockBtn) unlockBtn.addEventListener("click", () => {
    if (confirm("Unlock the final four? This clears any final-round scores entered so far.")) {
      state.stage2.qualifiers = null;
      state.stage2.scores = {};
      scheduleSave();
      render();
    }
  });
}

function renderManageGroups() {
  if (!adminMode) {
    document.getElementById("content").innerHTML = `<div class="empty-msg">Admin mode is required to manage groups.</div>`;
    return;
  }
  const groupKeys = ["A", "B", "C", "D", "E"];
  let html = `<div class="section-label">Roster by group</div>`;
  groupKeys.forEach(g => {
    const names = state.groups[g];
    html += `<div class="rules-block" style="border:1px solid var(--border-c); border-radius:8px; margin:0 1rem 0.8rem; padding:0.7rem 0.8rem;">
      <div style="font-family:'Fraunces', serif; font-weight:600; color:var(--pine); margin-bottom:0.4rem;">Group ${g} (${names.length})</div>`;
    names.forEach(nm => {
      html += `<div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
        <span style="flex:1; font-size:0.88rem;">${nm}</span>
        <select data-act="movesel" data-name="${nm}" data-from="${g}" style="font-size:0.78rem; padding:3px 5px; border-radius:5px; border:1px solid var(--border-c);">
          ${groupKeys.map(g2 => `<option value="${g2}" ${g2 === g ? "selected" : ""}>${g2}</option>`).join("")}
        </select>
        <button data-act="removeplayer" data-name="${nm}" data-from="${g}" style="border:1px solid var(--red); color:var(--red); background:var(--birch); border-radius:6px; width:26px; height:26px; cursor:pointer; font-size:0.85rem;" title="Remove from tournament">&times;</button>
      </div>`;
    });
    html += `</div>`;
  });

  if (state.removedPlayers.length) {
    html += `<div class="section-label">Removed players</div><div class="rules-block" style="margin:0 1rem;">`;
    state.removedPlayers.forEach(nm => {
      html += `<div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
        <span style="flex:1; font-size:0.88rem; color:var(--muted);">${nm}</span>
        <select data-act="addbacksel" data-name="${nm}" style="font-size:0.78rem; padding:3px 5px; border-radius:5px; border:1px solid var(--border-c);">
          ${groupKeys.map(g2 => `<option value="${g2}">${g2}</option>`).join("")}
        </select>
        <button data-act="addback" data-name="${nm}" style="border:1px solid var(--pine); color:var(--pine); background:var(--birch); border-radius:6px; padding:3px 10px; cursor:pointer; font-size:0.78rem;">Add back</button>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="section-label">Add a new player</div>
  <div class="rules-block" style="margin:0 1rem 1rem;">
    <div style="display:flex; align-items:center; gap:8px;">
      <input id="new-player-name" type="text" placeholder="Name" style="flex:1; font-size:0.88rem; padding:6px 8px; border-radius:6px; border:1px solid var(--border-c);">
      <select id="new-player-group" style="font-size:0.78rem; padding:6px 5px; border-radius:5px; border:1px solid var(--border-c);">
        ${groupKeys.map(g2 => `<option value="${g2}">${g2}</option>`).join("")}
      </select>
      <button id="add-new-player" class="btn-primary" style="width:auto; margin:0; padding:0.5rem 0.9rem;">Add</button>
    </div>
  </div>`;

  document.getElementById("content").innerHTML = html;

  document.querySelectorAll('[data-act="movesel"]').forEach(sel => {
    sel.addEventListener("change", () => {
      const { name, from } = sel.dataset;
      const to = sel.value;
      if (to === from) return;
      state.groups[from] = state.groups[from].filter(n => n !== name);
      state.groups[to].push(name);
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-act="removeplayer"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const { name, from } = btn.dataset;
      if (!confirm(`Remove ${name} from the tournament? You can add them back later from the Removed players list.`)) return;
      state.groups[from] = state.groups[from].filter(n => n !== name);
      if (!state.removedPlayers.includes(name)) state.removedPlayers.push(name);
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-act="addback"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const { name } = btn.dataset;
      const sel = document.querySelector(`[data-act="addbacksel"][data-name="${name}"]`);
      const to = sel ? sel.value : "A";
      state.removedPlayers = state.removedPlayers.filter(n => n !== name);
      state.groups[to].push(name);
      scheduleSave();
      render();
    });
  });
  const addBtn = document.getElementById("add-new-player");
  if (addBtn) addBtn.addEventListener("click", () => {
    const input = document.getElementById("new-player-name");
    const groupSel = document.getElementById("new-player-group");
    const name = input.value.trim();
    if (!name) return;
    const allNames = groupKeys.flatMap(g => state.groups[g]).concat(state.removedPlayers);
    if (allNames.includes(name)) {
      alert("That name is already in the tournament. Use a distinguishing name (e.g. add a last initial) to avoid mixing up scores.");
      return;
    }
    state.groups[groupSel.value].push(name);
    scheduleSave();
    render();
  });
}

function render() {
  renderBottomNav();
  if (["A", "B", "C", "D", "E"].includes(activeTab)) renderGroupView(activeTab);
  else if (activeTab === "leaderboard") renderLeaderboard();
  else if (activeTab === "final") renderFinal();
  else if (activeTab === "rules") renderRules();
  else if (activeTab === "manage") renderManageGroups();
  document.getElementById("footer").innerHTML = `Scores sync across every device on this link${adminMode ? ' &middot; <span id="manage-groups-link" style="text-decoration:underline; cursor:pointer;">Manage groups</span>' : ''}`;
  const lbBtn = document.getElementById("leaderboard-cta");
  if (lbBtn) lbBtn.onclick = () => { activeTab = "leaderboard"; render(); };
  const rulesLink = document.getElementById("rules-link");
  if (rulesLink) rulesLink.onclick = () => { activeTab = "rules"; render(); };
  const manageLink = document.getElementById("manage-groups-link");
  if (manageLink) manageLink.onclick = () => { activeTab = "manage"; render(); };
  const adminBtn = document.getElementById("admin-toggle");
  if (adminBtn) {
    adminBtn.textContent = adminMode ? "Admin: On (tap to exit)" : "Admin mode";
    adminBtn.style.background = adminMode ? "var(--gold)" : "var(--birch)";
    adminBtn.style.color = adminMode ? "var(--birch)" : "var(--muted)";
    adminBtn.style.borderColor = adminMode ? "var(--gold)" : "var(--border-c)";
    adminBtn.onclick = () => {
      if (adminMode) {
        adminMode = false;
        if (activeTab === "manage") activeTab = "leaderboard";
        render();
      } else {
        const entered = prompt("Enter admin passcode to edit scores:");
        if (entered === "1987") {
          adminMode = true;
          render();
        } else if (entered !== null) {
          alert("Incorrect passcode.");
        }
      }
    };
  }
}

function saveState() {
  dbRef.set(state).catch((e) => console.error("Firebase write failed:", e));
}

loadState();
</script>
</body>
