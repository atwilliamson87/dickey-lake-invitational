<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dickie Lake Invitational</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #00543C;
    --pine-dark: #003D2C;
    --birch: #FFFFFF;
    --panel: #F4F1E8;
    --row-alt: #F6F8F5;
    --border-c: #DDD8C8;
    --gold: #C9A227;
    --red: #A6192E;
    --ink: #16241C;
    --muted: #7A8177;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--birch);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 74px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.7rem 1rem;
    border-bottom: 2px solid var(--pine);
    background: var(--birch);
  }
  .topbar img { width: 68px; height: 68px; }
  .topbar .wordmark { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.3rem; color: var(--pine); letter-spacing: 0.01em; }
  .topbar .tagline { font-size: 0.75rem; color: var(--gold); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .subbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border-c);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--pine);
  }
  .subbar .sync { font-size: 0.7rem; color: var(--muted); font-family: 'Work Sans', sans-serif; font-weight: 500; display: flex; align-items: center; gap: 5px; }
  .sync-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  table { width: 100%; border-collapse: collapse; }
  .tbl-head th {
    background: var(--pine);
    color: var(--birch);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    padding: 8px 6px;
    text-align: center;
  }
  .tbl-head th:nth-child(2) { text-align: left; padding-left: 12px; }
  tbody tr { border-bottom: 1px solid var(--border-c); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  td { padding: 9px 6px; text-align: center; font-size: 0.85rem; vertical-align: middle; }
  td.pos { color: var(--muted); font-weight: 500; font-size: 0.78rem; width: 34px; }
  td.player { text-align: left; padding-left: 12px; font-family: 'Fraunces', serif; font-weight: 600; color: var(--pine); text-transform: uppercase; letter-spacing: 0.01em; font-size: 0.82rem; }
  td.pts { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.9rem; }
  td.pts.pos-score { color: var(--red); }
  td.pts.zero-score { color: var(--muted); }
  .hole-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem 0.4rem;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--pine);
  }
  .hole-heading .par { font-size: 0.68rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .stepper { display: inline-flex; align-items: center; gap: 5px; }
  .stepper button {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border-c);
    background: var(--birch);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .stepper button:active { background: var(--panel); }
  .stepper .val {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.92rem;
    width: 18px;
    text-align: center;
    display: inline-block;
  }
  .chip-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 1px solid var(--border-c);
    background: var(--birch);
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--border-c);
  }
  .chip-btn.on { background: var(--gold); border-color: var(--gold); color: var(--birch); }
  .section-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    padding: 1.1rem 1rem 0.3rem;
  }
  .btn-primary {
    background: var(--pine);
    color: var(--birch);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1rem;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    width: calc(100% - 2rem);
    margin: 0.7rem 1rem;
  }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost {
    background: var(--birch);
    color: var(--pine);
    border: 1px solid var(--pine);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 0.83rem;
    cursor: pointer;
    width: calc(100% - 2rem);
    margin: 0.4rem 1rem 1rem;
  }
  .empty-msg { font-size: 0.88rem; color: var(--muted); text-align: center; padding: 2rem 1rem; }
  .tiebreak-panel { margin: 0 1rem 0.6rem; border: 1px solid var(--border-c); border-radius: 8px; padding: 0.6rem 0.8rem; }
  .tiebreak-item { display: flex; align-items: center; gap: 10px; padding: 0.35rem 0; font-size: 0.85rem; }
  .champion-banner {
    background: var(--pine);
    color: var(--gold);
    border-radius: 0;
    padding: 1.1rem;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 0.4rem;
  }
  .star { color: var(--gold); font-size: 0.95rem; }
  .star.dim { color: var(--border-c); }
  .bottomnav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--birch);
    border-top: 1px solid var(--border-c);
    max-width: 640px;
    margin: 0 auto;
  }
  .navbtn {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 2px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
  }
  .navbtn .glyph { font-size: 1.05rem; line-height: 1; }
  .navbtn.active { color: var(--pine); font-weight: 600; }
  .footer-note { font-size: 0.7rem; color: var(--muted); text-align: center; padding: 1rem 1rem 0.5rem; }
  .footer-note span { text-decoration: underline; cursor: pointer; }
  .rules-block { padding: 0 1rem 0.4rem; font-size: 0.86rem; line-height: 1.55; color: var(--ink); }
  .rules-block ul { margin: 0; padding-left: 1.1rem; }
  .rules-block li { margin-bottom: 0.4rem; }
  .rules-block p { margin: 0; }
</style>
</head>

<script>
const HOLES = [1,2,3,4,5,6];
const GROUPS = {
  A: ["Andrew","Anna","Jordan","Danielle"],
  B: ["Katie","Sully","Everly","Charlotte"],
  C: ["Connor","James","Tara","Open Spot (TBD)"]
};
const STORAGE_KEY = "bucket-golf-state-v1";
const TAB_LABELS = { A: "Group A", B: "Group B", C: "Group C", leaderboard: "Leaderboard", final: "Final four", rules: "Rules" };
const TAB_GLYPHS = { A: "&#9910;", B: "&#9910;", C: "&#9910;", leaderboard: "&#9873;", final: "&#127942;", rules: "&#128220;" };

function defaultState() {
  return {
    stage1: { A: {}, B: {}, C: {} },
    stage2: { qualifiers: null, scores: {} }
  };
}

let state = defaultState();
let activeTab = "A";
let suppressPollUntil = 0;

function cellData(holeObj, name) {
  return holeObj && holeObj[name] ? holeObj[name] : { strokes: null, chipin: false };
}

function computeHolePoints(names, holeObj) {
  const entries = names
    .map(n => ({ name: n, strokes: cellData(holeObj, n).strokes }))
    .filter(e => e.strokes != null);
  const n = names.length;
  const result = {};
  names.forEach(nm => result[nm] = 0);
  if (entries.length === 0) return result;
  entries.sort((a, b) => a.strokes - b.strokes);
  let i = 0;
  while (i < entries.length) {
    let j = i;
    while (j + 1 < entries.length && entries[j + 1].strokes === entries[i].strokes) j++;
    let sum = 0;
    for (let k = i; k <= j; k++) sum += (n - k);
    const avg = sum / (j - i + 1);
    for (let k = i; k <= j; k++) result[entries[k].name] = avg;
    i = j + 1;
  }
  return result;
}

function totalsForGroup(names, stageObj) {
  const totals = {};
  names.forEach(nm => totals[nm] = 0);
  HOLES.forEach(h => {
    const holeObj = stageObj["hole" + h] || {};
    const pts = computeHolePoints(names, holeObj);
    names.forEach(nm => {
      totals[nm] += pts[nm];
      if (cellData(holeObj, nm).chipin) totals[nm] += 1;
    });
  });
  return totals;
}

function fmtPts(v) {
  const r = Math.round(v * 10) / 10;
  return (r % 1 === 0) ? String(r) : r.toFixed(1);
}

function rankLabels(rows) {
  const sorted = rows.slice().sort((a, b) => b.value - a.value);
  const labels = {};
  let i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j + 1 < sorted.length && sorted[j + 1].value === sorted[i].value) j++;
    const rank = i + 1;
    const tied = (j > i);
    sorted.slice(i, j + 1).forEach(r => { labels[r.key] = (tied ? "T" : "") + rank; });
    i = j + 1;
  }
  return labels;
}

async function loadState() {
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value) {
      state = JSON.parse(res.value);
    } else {
      state = defaultState();
      await saveState();
    }
  } catch (e) {
    state = defaultState();
    await saveState();
  }
  render();
}

let saveTimer = null;
function scheduleSave() {
  suppressPollUntil = Date.now() + 3500;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(state), true); } catch (e) {}
  }, 350);
}

async function pollRemote() {
  if (Date.now() < suppressPollUntil) return;
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value) {
      const remote = res.value;
      if (remote !== JSON.stringify(state)) {
        state = JSON.parse(remote);
        render();
      }
    }
  } catch (e) {}
}
setInterval(pollRemote, 4000);

function setStrokes(stageObj, name, holeNum, delta) {
  const key = "hole" + holeNum;
  if (!stageObj[key]) stageObj[key] = {};
  if (!stageObj[key][name]) stageObj[key][name] = { strokes: null, chipin: false };
  let cur = stageObj[key][name].strokes;
  let next = cur == null ? 1 : cur + delta;
  if (next < 1) next = 1;
  if (next > 6) next = 6;
  stageObj[key][name].strokes = next;
}

function toggleChip(stageObj, name, holeNum) {
  const key = "hole" + holeNum;
  if (!stageObj[key]) stageObj[key] = {};
  if (!stageObj[key][name]) stageObj[key][name] = { strokes: null, chipin: false };
  stageObj[key][name].chipin = !stageObj[key][name].chipin;
}

function renderBottomNav() {
  const tabs = ["A", "B", "C", "leaderboard", "final", "rules"];
  const el = document.getElementById("bottomnav");
  el.innerHTML = tabs.map(t =>
    `<button class="navbtn ${activeTab === t ? 'active' : ''}" data-tab="${t}">
      <span class="glyph">${TAB_GLYPHS[t]}</span>${TAB_LABELS[t]}
    </button>`
  ).join("");
  el.querySelectorAll(".navbtn").forEach(btn => {
    btn.addEventListener("click", () => { activeTab = btn.dataset.tab; render(); });
  });
  document.getElementById("subbar-title").textContent = TAB_LABELS[activeTab];
}

function renderGroupView(groupKey) {
  const names = GROUPS[groupKey];
  const stageObj = state.stage1[groupKey];
  const totals = totalsForGroup(names, stageObj);
  let html = "";
  HOLES.forEach(h => {
    const key = "hole" + h;
    const holeObj = stageObj[key] || {};
    const pts = computeHolePoints(names, holeObj);
    const ranks = rankLabels(names.map(nm => ({ key: nm, value: cellData(holeObj, nm).strokes == null ? -999 : -cellData(holeObj, nm).strokes })));
    html += `<div class="hole-heading">Hole ${h} <span class="par">Par 3</span></div>
    <table><thead><tr class="tbl-head"><th>Pos</th><th>Player</th><th>Strokes</th><th>Chip</th><th>Pts</th></tr></thead><tbody>`;
    names.forEach(nm => {
      const cd = cellData(holeObj, nm);
      const p = pts[nm] + (cd.chipin ? 1 : 0);
      const posLabel = cd.strokes == null ? "-" : ranks[nm];
      html += `<tr>
        <td class="pos">${posLabel}</td>
        <td class="player">${nm}</td>
        <td><div class="stepper">
          <button data-act="minus" data-group="${groupKey}" data-name="${nm}" data-hole="${h}">-</button>
          <span class="val">${cd.strokes == null ? '-' : cd.strokes}</span>
          <button data-act="plus" data-group="${groupKey}" data-name="${nm}" data-hole="${h}">+</button>
        </div></td>
        <td><button class="chip-btn ${cd.chipin ? 'on' : ''}" data-act="chip" data-group="${groupKey}" data-name="${nm}" data-hole="${h}" title="Chip-in bonus">&#9679;</button></td>
        <td class="pts ${cd.strokes == null ? '' : (p > 0 ? 'pos-score' : 'zero-score')}">${cd.strokes == null ? '' : fmtPts(p)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });
  html += `<div class="section-label">Group ${groupKey} standings</div>
  <table><thead><tr class="tbl-head"><th>Pos</th><th>Player</th><th></th><th></th><th>Total</th></tr></thead><tbody>`;
  const sorted = names.map(nm => ({ nm, total: totals[nm] })).sort((a, b) => b.total - a.total);
  const ranks2 = rankLabels(names.map(nm => ({ key: nm, value: totals[nm] })));
  sorted.forEach(row => {
    html += `<tr><td class="pos">${ranks2[row.nm]}</td><td class="player">${row.nm}</td><td></td><td></td><td class="pts pos-score">${fmtPts(row.total)}</td></tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("content").innerHTML = html;

  document.querySelectorAll('[data-act="plus"], [data-act="minus"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const { name, hole, group } = btn.dataset;
      setStrokes(state.stage1[group], name, hole, btn.dataset.act === "plus" ? 1 : -1);
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-act="chip"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const { name, hole, group } = btn.dataset;
      toggleChip(state.stage1[group], name, hole);
      scheduleSave();
      render();
    });
  });
}

function allTwelveTotals() {
  let all = [];
  Object.keys(GROUPS).forEach(g => {
    const totals = totalsForGroup(GROUPS[g], state.stage1[g]);
    GROUPS[g].forEach(nm => all.push({ name: nm, group: g, total: totals[nm] }));
  });
  all.sort((a, b) => b.total - a.total);
  return all;
}

function renderLeaderboard() {
  const all = allTwelveTotals();
  const locked = !!state.stage2.qualifiers;
  const ranks = rankLabels(all.map(r => ({ key: r.name, value: r.total })));
  let html = `<table><thead><tr class="tbl-head"><th>Pos</th><th>Player</th><th>Grp</th><th></th><th>Pts</th></tr></thead><tbody>`;
  const cutoffIdx = 3;
  const cutoffVal = all.length > cutoffIdx ? all[cutoffIdx].total : -1;
  all.forEach((row, idx) => {
    const inTop4 = idx < 4;
    html += `<tr>
      <td class="pos">${ranks[row.name]}</td>
      <td class="player">${row.name}</td>
      <td style="font-size:0.75rem; color:var(--muted);">${row.group}</td>
      <td>${inTop4 ? '<span class="star">&#9733;</span>' : '<span class="star dim">&#9733;</span>'}</td>
      <td class="pts pos-score">${fmtPts(row.total)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  if (!locked) {
    const tiedAtCutoff = all.filter(r => r.total === cutoffVal);
    const clearIn = all.filter(r => r.total > cutoffVal);
    const needed = 4 - clearIn.length;
    if (tiedAtCutoff.length > needed && needed > 0) {
      html += `<div class="section-label">Tie at the cutoff &mdash; pick ${needed} to advance</div><div class="tiebreak-panel" id="tiebreak-box">`;
      tiedAtCutoff.forEach(r => {
        html += `<label class="tiebreak-item"><input type="checkbox" class="tie-check" data-name="${r.name}"> ${r.name} (${fmtPts(r.total)} pts)</label>`;
      });
      html += `</div><button class="btn-primary" id="lock-tiebreak" disabled>Lock final four</button>`;
    } else {
      html += `<button class="btn-primary" id="lock-final">Lock final four</button>`;
    }
  } else {
    html += `<div class="section-label">Final four locked</div><div class="tiebreak-panel"><p style="margin:0;font-size:0.85rem;">${state.stage2.qualifiers.join(", ")}</p></div><button class="btn-ghost" id="unlock-final">Unlock and re-pick</button>`;
  }
  document.getElementById("content").innerHTML = html;

  const lockBtn = document.getElementById("lock-final");
  if (lockBtn) lockBtn.addEventListener("click", () => {
    state.stage2.qualifiers = all.slice(0, 4).map(r => r.name);
    state.stage2.scores = {};
    scheduleSave();
    activeTab = "final";
    render();
  });

  const tieBoxes = document.querySelectorAll(".tie-check");
  const lockTieBtn = document.getElementById("lock-tiebreak");
  if (tieBoxes.length) {
    const clearIn = all.filter(r => r.total > cutoffVal).map(r => r.name);
    const needed = 4 - clearIn.length;
    tieBoxes.forEach(cb => cb.addEventListener("change", () => {
      const checked = Array.from(tieBoxes).filter(x => x.checked);
      lockTieBtn.disabled = checked.length !== needed;
    }));
    lockTieBtn.addEventListener("click", () => {
      const checked = Array.from(tieBoxes).filter(x => x.checked).map(x => x.dataset.name);
      state.stage2.qualifiers = clearIn.concat(checked);
      state.stage2.scores = {};
      scheduleSave();
      activeTab = "final";
      render();
    });
  }

  const unlockBtn = document.getElementById("unlock-final");
  if (unlockBtn) unlockBtn.addEventListener("click", () => {
    if (confirm("Unlock the final four? This clears any final-round scores entered so far.")) {
      state.stage2.qualifiers = null;
      state.stage2.scores = {};
      scheduleSave();
      render();
    }
  });
}

function renderFinal() {
  if (!state.stage2.qualifiers) {
    document.getElementById("content").innerHTML = `<div class="empty-msg">Final four hasn't been locked in yet. Head to the leaderboard tab once group stage scoring wraps up.</div>`;
    return;
  }
  const names = state.stage2.qualifiers;
  const stageObj = state.stage2.scores;
  const totals = totalsForGroup(names, stageObj);
  const allHolesFilled = HOLES.every(h => {
    const holeObj = stageObj["hole" + h] || {};
    return names.every(nm => cellData(holeObj, nm).strokes != null);
  });
  let html = "";
  if (allHolesFilled) {
    const sorted = names.map(nm => ({ nm, total: totals[nm] })).sort((a, b) => b.total - a.total);
    html += `<div class="champion-banner">&#127942; Champion: ${sorted[0].nm}</div>`;
  }
  HOLES.forEach(h => {
    const key = "hole" + h;
    const holeObj = stageObj[key] || {};
    const pts = computeHolePoints(names, holeObj);
    const ranks = rankLabels(names.map(nm => ({ key: nm, value: cellData(holeObj, nm).strokes == null ? -999 : -cellData(holeObj, nm).strokes })));
    html += `<div class="hole-heading">Hole ${h} <span class="par">Par 3 &middot; Final</span></div>
    <table><thead><tr class="tbl-head"><th>Pos</th><th>Player</th><th>Strokes</th><th>Chip</th><th>Pts</th></tr></thead><tbody>`;
    names.forEach(nm => {
      const cd = cellData(holeObj, nm);
      const p = pts[nm] + (cd.chipin ? 1 : 0);
      const posLabel = cd.strokes == null ? "-" : ranks[nm];
      html += `<tr>
        <td class="pos">${posLabel}</td>
        <td class="player">${nm}</td>
        <td><div class="stepper">
          <button data-act="minus" data-name="${nm}" data-hole="${h}">-</button>
          <span class="val">${cd.strokes == null ? '-' : cd.strokes}</span>
          <button data-act="plus" data-name="${nm}" data-hole="${h}">+</button>
        </div></td>
        <td><button class="chip-btn ${cd.chipin ? 'on' : ''}" data-act="chip" data-name="${nm}" data-hole="${h}" title="Chip-in bonus">&#9679;</button></td>
        <td class="pts ${cd.strokes == null ? '' : (p > 0 ? 'pos-score' : 'zero-score')}">${cd.strokes == null ? '' : fmtPts(p)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });
  html += `<div class="section-label">Final four standings</div>
  <table><thead><tr class="tbl-head"><th>Pos</th><th>Player</th><th></th><th></th><th>Total</th></tr></thead><tbody>`;
  const sorted = names.map(nm => ({ nm, total: totals[nm] })).sort((a, b) => b.total - a.total);
  const ranks2 = rankLabels(names.map(nm => ({ key: nm, value: totals[nm] })));
  sorted.forEach(row => {
    html += `<tr><td class="pos">${ranks2[row.nm]}</td><td class="player">${row.nm}</td><td></td><td></td><td class="pts pos-score">${fmtPts(row.total)}</td></tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("content").innerHTML = html;

  document.querySelectorAll('[data-act="plus"], [data-act="minus"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const { name, hole } = btn.dataset;
      setStrokes(state.stage2.scores, name, hole, btn.dataset.act === "plus" ? 1 : -1);
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-act="chip"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const { name, hole } = btn.dataset;
      toggleChip(state.stage2.scores, name, hole);
      scheduleSave();
      render();
    });
  });
}

function renderRules() {
  const html = `
    <div class="section-label">Format</div>
    <div class="rules-block">
      <p>3 groups of 4, staggered tee times so groups don't bottleneck at buckets. 12 players, 6 holes.</p>
    </div>
    <div class="section-label">How each hole works</div>
    <div class="rules-block">
      <ul>
        <li>Every hole is a par 3 &mdash; 3 shots to hole out</li>
        <li>One club per player for the whole round, no switching</li>
        <li>Hitting any part of the bucket completes the hole</li>
        <li>Stroke cap: 6 per hole (double par) &mdash; pick up and take a 6 if not in by then</li>
      </ul>
    </div>
    <div class="section-label">Scoring</div>
    <div class="rules-block">
      <ul>
        <li>Points per hole, within your group of 4: 1st = 4 pts, 2nd = 3 pts, 3rd = 2 pts, 4th = 1 pt</li>
        <li>Ties split the points for those places evenly</li>
        <li>Chip-in bonus: +1 point if the ball lands and stays inside the bucket</li>
      </ul>
    </div>
    <div class="section-label">Final four</div>
    <div class="rules-block">
      <ul>
        <li>Top 4 total scorers across the entire field advance &mdash; no group restrictions, a group can send anywhere from 0 to 4 players</li>
        <li>The final round starts completely fresh, no carryover from the group stage</li>
        <li>Same points system (4-3-2-1 per hole)</li>
        <li>Winner takes the whole invitational</li>
      </ul>
    </div>
  `;
  document.getElementById("content").innerHTML = html;
}


function render() {
  renderBottomNav();
  if (activeTab === "A" || activeTab === "B" || activeTab === "C") renderGroupView(activeTab);
  else if (activeTab === "leaderboard") renderLeaderboard();
  else if (activeTab === "final") renderFinal();
  else if (activeTab === "rules") renderRules();
  document.getElementById("footer").innerHTML = `Scores sync across every device on this link &middot; <span id="reset-link">reset tournament</span>`;
  const resetLink = document.getElementById("reset-link");
  if (resetLink) resetLink.addEventListener("click", async () => {
    if (confirm("Reset the entire tournament? This clears all scores for everyone.")) {
      state = defaultState();
      await saveState();
      render();
    }
  });
}

async function saveState() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(state), true); } catch (e) {}
}

loadState();
</script>
</body>
</html>
